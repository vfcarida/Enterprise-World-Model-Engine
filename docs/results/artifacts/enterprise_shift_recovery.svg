<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title-sr desc-sr">
  <title id="title-sr">Family D Deployment Shift Error and Audit-Delayed Recovery</title>
  <desc id="desc-sr">Bar comparison of pre-shift MAE, peak post-shift MAE during audit telemetry delay, and steady-state post-shift MAE across the four baselines.</desc>
  <rect width="100%" height="100%" fill="#0f172a" rx="8"/>
  <text x="24" y="34" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Family D (DeploymentShift): Pre-Shift vs. Peak Transient vs. Post-Recovery MAE</text>
  <text x="24" y="54" fill="#94a3b8" font-family="monospace" font-size="11">Unseen reserve_ratio (0.10 -> 0.35) &amp; expedite_fee ($2 -> $14) shift at step 8 with 2-step audit telemetry lag</text>
  <rect x="55" y="228.8" width="32" height="6.2" fill="#38bdf8" rx="2"/>
  <rect x="93" y="102.0" width="32" height="133.0" fill="#f59e0b" rx="2"/>
  <rect x="131" y="118.4" width="32" height="116.6" fill="#ef4444" rx="2"/>
  <text x="109" y="255" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">rules-only</text>
  <text x="109" y="271" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Unrecovered</text>
  <rect x="225" y="234.5" width="32" height="2.0" fill="#38bdf8" rx="2"/>
  <rect x="263" y="108.9" width="32" height="126.1" fill="#f59e0b" rx="2"/>
  <rect x="301" y="124.2" width="32" height="110.8" fill="#ef4444" rx="2"/>
  <text x="279" y="255" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">learned-only</text>
  <text x="279" y="271" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Unrecovered</text>
  <rect x="395" y="234.5" width="32" height="2.0" fill="#38bdf8" rx="2"/>
  <rect x="433" y="108.9" width="32" height="126.1" fill="#f59e0b" rx="2"/>
  <rect x="471" y="124.2" width="32" height="110.8" fill="#ef4444" rx="2"/>
  <text x="449" y="255" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">static hybrid</text>
  <text x="449" y="271" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Unrecovered</text>
  <rect x="565" y="234.5" width="32" height="2.0" fill="#38bdf8" rx="2"/>
  <rect x="603" y="115.6" width="32" height="119.4" fill="#f59e0b" rx="2"/>
  <rect x="641" y="234.5" width="32" height="2.0" fill="#ef4444" rx="2"/>
  <text x="619" y="255" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">hybrid + runtime c</text>
  <text x="619" y="271" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Rec: 2 steps</text>
  <text x="24" y="286" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Legend: [Blue] Pre-Shift MAE | [Amber] Peak Post-Shift MAE (during 2-step audit lag) | [Red] Steady-State Post-Shift MAE</text>
</svg>
