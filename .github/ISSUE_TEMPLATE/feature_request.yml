name: Feature Request
description: Suggest an idea or enhancement for EWM Engine
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for suggesting an improvement!
  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: Is your feature request related to a problem or limitation?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / API Design
      description: Describe the solution or new abstraction you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative designs or workarounds you've considered?
