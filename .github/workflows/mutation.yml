name: Mutation Testing (mutmut)

on:
  pull_request:
    paths:
      - "src/ewm_engine/core/**"
      - "src/ewm_engine/simulation/**"
      - "src/ewm_engine/constraints/**"
      - "src/ewm_engine/provenance/**"
      - "src/ewm_engine/durability/**"
      - "src/ewm_engine/verification/**"
  schedule:
    # Nightly run at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-lines-gate:
    name: PR Mutation Gate (Changed Functions)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install mutmut>=3.0.0

      - name: Run Changed-Lines Mutation Gate
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python scripts/run_mutation_gate.py --changed-only --base-ref "origin/${BASE_REF}"

  nightly-campaign:
    name: Nightly Full Core Mutation Campaign
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install mutmut>=3.0.0

      - name: Execute Full-Core Mutation Run
        run: |
          python scripts/run_mutation_gate.py --full-core --output mutation_summary.json

      - name: Upload Mutation Summary Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: mutation-summary
          path: mutation_summary.json
