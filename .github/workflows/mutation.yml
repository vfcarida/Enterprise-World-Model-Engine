name: Mutation Testing (mutmut)

on:
  pull_request:
    paths:
      - "src/ewm_engine/core/**"
      - "src/ewm_engine/simulation/**"
      - "src/ewm_engine/constraints/**"
      - "src/ewm_engine/provenance/**"
      - "src/ewm_engine/durability/**"
      - "src/ewm_engine/verification/**"
  schedule:
    # Nightly run at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-lines-gate:
    name: PR Mutation Gate (Changed Functions)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install mutmut>=3.0.0

      - name: Run Changed-Lines Mutation Gate
        run: |
          python scripts/run_mutation_gate.py --changed-only --base-ref origin/${{ github.base_ref }}

  nightly-campaign:
    name: Nightly Full Core Mutation Campaign
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install mutmut>=3.0.0

      - name: Execute Full-Core Mutation Run
        run: |
          python scripts/run_mutation_gate.py --full-core --output mutation_summary.json

      - name: Upload Mutation Summary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mutation-summary
          path: mutation_summary.json
