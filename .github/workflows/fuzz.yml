name: Fuzzing & Untrusted Input Rigor

on:
  pull_request:
    paths:
      - "src/ewm_engine/serialization/**"
      - "tests/fuzz/**"
  schedule:
    # Nightly continuous fuzz campaign at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-fuzz-gate:
    name: PR Fuzz Smoke Gate (Atheris / Structured)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install dependencies & Atheris
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install atheris || echo "Atheris optional binary fallback"

      - name: Run Bounded Fuzz Smoke
        run: |
          python scripts/run_fuzz_smoke.py --max-seconds 10.0

      - name: Run Pytest Fuzz Test Suite
        run: |
          pytest -m fuzz -q

  nightly-hypofuzz-continuous:
    name: Nightly Deep Fuzz Campaign
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install atheris || true

      - name: Run Deep Fuzzing (60s/target)
        run: |
          python scripts/run_fuzz_smoke.py --max-seconds 60.0
