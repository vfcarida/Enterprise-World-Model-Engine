name: Upstream Unlocked Range Resolution

on:
  schedule:
    - cron: "0 5 * * 1" # Weekly on Monday at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unlocked-resolution:
    name: Unlocked Resolution (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: "false"

      - name: Install with latest compatible unlocked dependencies
        run: |
          uv pip install --system --upgrade ".[all,dev]"

      - name: Run Core & Packaging Tests against Unpinned Upstream
        run: |
          pytest tests/unit tests/contract tests/packaging -q
