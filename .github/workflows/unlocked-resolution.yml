name: Upstream Unlocked Range Resolution

on:
  schedule:
    - cron: "0 5 * * 1" # Weekly on Monday at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unlocked-resolution:
    name: Unlocked Resolution (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: "false"

      - name: Install with latest compatible unlocked dependencies
        run: |
          uv pip install --system --upgrade ".[all,dev]"

      - name: Run Core & Packaging Tests against Unpinned Upstream
        run: |
          pytest tests/unit tests/contract tests/packaging -q
