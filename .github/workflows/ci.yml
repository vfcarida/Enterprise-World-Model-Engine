name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'merge_group' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  zizmor:
    name: GitHub Actions Security Audit (zizmor)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run zizmor
        run: uvx zizmor --min-severity medium .github/workflows .github/actions

  action-pins-and-spec0:
    name: Action SHA Pinning & SPEC 0 Checks
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.11"

      - name: Verify 100% Action SHA Pinning
        run: uv run python scripts/check_action_pins.py

      - name: Enforce SPEC 0 Compatibility
        run: uv run pytest tests/packaging/test_spec0_compliance.py -v

  lint:
    name: Lint Check (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Ruff Lint
        run: uv run ruff check src tests examples benchmarks

  format-check:
    name: Formatting Check (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Ruff Format Check
        run: uv run ruff format --check src tests examples benchmarks

  type-check:
    name: Type Check (Mypy Strict)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Mypy
        run: uv run mypy src tests examples benchmarks

  citation-check:
    name: Citation Metadata Validation (cffconvert)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate CITATION.cff
        uses: citation-file-format/cffconvert-github-action@4cf11baa70a673bfec112acf80073161f4ba332b # 2.0.0
        with:
          args: "--validate"

  pip-audit:
    name: Dependency Vulnerability Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.11"

      - name: Install dependencies from lockfile
        run: uv sync --extra dev --extra all

      - name: Run pip-audit against pinned environment
        run: uv run pip-audit --strict --desc

  pyrefly-canary:
    name: Type Speed-Canary (Pyrefly Advisory)
    runs-on: ubuntu-latest
    continue-on-error: true # Advisory speed-canary per ADR-035
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1641328005b630e69882bf6b9fb543eb3fef0437 # v5.1.0

      - name: Run Pyrefly Type Check
        run: uvx pyrefly check src

  packaging-tests:
    name: Packaging & Wheel Artifact Tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.11"

      - name: Install dependencies & build wheel
        run: |
          uv sync --extra dev
          uv run python -m build

      - name: Run Packaging Tests
        run: uv run pytest tests/packaging/ -v

  unit-tests:
    name: Unit Tests (${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.13t"
            experimental: true
          - os: ubuntu-latest
            python-version: "3.14-dev"
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Unit Tests with Branch Coverage & Parallelism
        run: uv run pytest tests/unit -n auto --dist worksteal --cov=ewm_engine --cov-branch --cov-report=xml --cov-report=term-missing

      - name: Enforce Diff-Cover Patch Coverage Gate (>=90%)
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          uv run diff-cover coverage.xml --compare-branch "origin/${BASE_REF}" --fail-under 90.0

      - name: Enforce Coverage Quality Gate (>=85% overall, >=90% core areas)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run python scripts/check_coverage.py

      - name: Verify Core Installs Without Extras (AC-019 Gate)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          uv venv /tmp/clean_core_env
          uv pip install --python /tmp/clean_core_env/bin/python .
          /tmp/clean_core_env/bin/python -c "import ewm_engine; from ewm_engine import World, WorldState; print('Core install OK:', ewm_engine.__version__)"

      - name: Prune uv cache before save
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv cache prune --ci

      - name: Upload Coverage Artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: coverage-report
          path: coverage.xml

  property-tests:
    name: Property-Based Tests (Hypothesis CI Profile)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Property Tests with CI Profile
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run pytest tests/property -n auto --dist worksteal

  fuzz-smoke:
    name: Fuzz Smoke Gate (YAML, JSON, WSL)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Untrusted Input Fuzz Smoke
        run: uv run python scripts/run_fuzz_smoke.py --max-seconds 5.0

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Integration Tests
        run: uv run pytest tests/integration

  contract-tests:
    name: Contract & Packaging Tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Contract Tests
        run: uv run pytest tests/contract

  security-tests:
    name: Security Tests & Credential Scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Security Tests
        run: uv run pytest tests/security

  example-tests:
    name: Acceptance Example Tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Example Tests
        run: uv run pytest tests/examples

      - name: Run Benchmark Regression Guard
        run: uv run pytest tests/benchmark -m benchmark

  architecture-tests:
    name: Architecture & Import Boundary Tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Architecture Tests
        run: uv run pytest tests/architecture

  package-build:
    name: Package Build & Wheel Verification
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.11"

      - name: Install build & dev dependencies
        run: uv sync --extra dev

      - name: Build distributions with python -m build
        run: uv run python -m build

      - name: Verify package metadata with twine check
        run: uv run twine check dist/*

      - name: Run wheel installation & quickstart smoke test (AC-016/021)
        run: uv run pytest tests/contract/test_packaging.py -k test_wheel_install_and_quickstart_smoke

  docs-build:
    name: Documentation Build (Strict Mode)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.11"

      - name: Install documentation dependencies
        run: uv sync --extra docs

      - name: Build Documentation (Strict)
        run: uv run mkdocs build --strict

  memory-gates:
    name: Deterministic Memory & Leak Gates (memray)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Deterministic Memory Gates with memray
        run: uv run pytest tests/performance/test_memory_gates.py --memray -v

  numerical-tests:
    name: Numerical Reproducibility & Differential Tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Numerical Tests
        run: uv run pytest tests/numerical/ -v

  ci-gates:
    name: All CI Quality Gates Passed
    if: always()
    needs:
      - zizmor
      - action-pins-and-spec0
      - lint
      - format-check
      - type-check
      - citation-check
      - pip-audit
      - packaging-tests
      - unit-tests
      - property-tests
      - integration-tests
      - contract-tests
      - security-tests
      - example-tests
      - architecture-tests
      - package-build
      - docs-build
      - memory-gates
      - numerical-tests
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Gates
        run: |
          failures=()
          echo "Checking status of all required quality gates..."
          if [[ "${{ needs.zizmor.result }}" != "success" ]]; then failures+=("zizmor"); fi
          if [[ "${{ needs.action-pins-and-spec0.result }}" != "success" ]]; then failures+=("action-pins-and-spec0"); fi
          if [[ "${{ needs.lint.result }}" != "success" ]]; then failures+=("lint"); fi
          if [[ "${{ needs.format-check.result }}" != "success" ]]; then failures+=("format-check"); fi
          if [[ "${{ needs.type-check.result }}" != "success" ]]; then failures+=("type-check"); fi
          if [[ "${{ needs.citation-check.result }}" != "success" ]]; then failures+=("citation-check"); fi
          if [[ "${{ needs.pip-audit.result }}" != "success" ]]; then failures+=("pip-audit"); fi
          if [[ "${{ needs.packaging-tests.result }}" != "success" ]]; then failures+=("packaging-tests"); fi
          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then failures+=("unit-tests"); fi
          if [[ "${{ needs.property-tests.result }}" != "success" ]]; then failures+=("property-tests"); fi
          if [[ "${{ needs.integration-tests.result }}" != "success" ]]; then failures+=("integration-tests"); fi
          if [[ "${{ needs.contract-tests.result }}" != "success" ]]; then failures+=("contract-tests"); fi
          if [[ "${{ needs.security-tests.result }}" != "success" ]]; then failures+=("security-tests"); fi
          if [[ "${{ needs.example-tests.result }}" != "success" ]]; then failures+=("example-tests"); fi
          if [[ "${{ needs.architecture-tests.result }}" != "success" ]]; then failures+=("architecture-tests"); fi
          if [[ "${{ needs.package-build.result }}" != "success" ]]; then failures+=("package-build"); fi
          if [[ "${{ needs.docs-build.result }}" != "success" ]]; then failures+=("docs-build"); fi
          if [[ "${{ needs.memory-gates.result }}" != "success" ]]; then failures+=("memory-gates"); fi
          if [[ "${{ needs.numerical-tests.result }}" != "success" ]]; then failures+=("numerical-tests"); fi

          if [ ${#failures[@]} -ne 0 ]; then
            echo "CI Gate Check FAILED! Failed jobs: ${failures[*]}"
            exit 1
          fi
          echo "All 19 CI quality gates passed successfully."
