name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      test_pypi_only:
        description: "Publish to TestPyPI only (dry run)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Build, Attest & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    environment:
      name: pypi
      url: https://pypi.org/p/ewm-engine
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv (isolated, uncached for release integrity)
        uses: astral-sh/setup-uv@1641328005b630e69882bf6b9fb543eb3fef0437 # v5.1.0
        with:
          enable-cache: false

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: uv sync --extra dev

      - name: Assert Version Equals Git Tag & Reject .dev/Local Builds (Truth Gate)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Expected version stripped of leading 'v'
          EXPECTED_VERSION="${TAG_NAME#v}"
          DETECTED_VERSION=$(uv run python -c "import ewm_engine; print(ewm_engine.__version__)")
          echo "Release Git Tag: ${TAG_NAME}"
          echo "Expected Version: ${EXPECTED_VERSION}"
          echo "Detected Version: ${DETECTED_VERSION}"

          if [ "${DETECTED_VERSION}" != "${EXPECTED_VERSION}" ]; then
            echo "[ERROR] Version drift! Package version (${DETECTED_VERSION}) does not match release tag (${TAG_NAME})."
            exit 1
          fi

          if [[ "${DETECTED_VERSION}" =~ (\.dev|\+) ]]; then
            echo "[ERROR] Unclean version segment detected (${DETECTED_VERSION})! Releasing .dev or local builds to PyPI is rejected."
            exit 1
          fi
          echo "[SUCCESS] Version truth verified: ${DETECTED_VERSION} == ${EXPECTED_VERSION}"

      - name: Build distributions (sdist & wheel)
        run: uv run python -m build

      - name: Verify package metadata with twine check
        run: uv run twine check dist/*

      - name: Verify clean wheel installation & README Quickstart execution
        run: |
          uv venv /tmp/clean-test-env
          uv pip install --python /tmp/clean-test-env dist/*.whl
          uv run --python /tmp/clean-test-env python scripts/test_doc_snippets.py

      - name: Generate CycloneDX SBOM (JSON)
        run: uvx --from cyclonedx-bom cyclonedx-py environment --output-format json --outfile dist/cyclonedx-bom.json

      - name: Generate Syft SBOM (from built wheels)
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          file: dist/
          format: spdx-json
          output-file: dist/syft-bom.spdx.json

      - name: Generate SLSA Build Provenance (L2+)
        uses: actions/attest-build-provenance@c074443f1a5fb4aee83904b7124fa4116e442a69 # v2.2.3
        with:
          subject-path: "dist/*"

      - name: Publish to TestPyPI (Dry-run / Staging)
        if: github.event.inputs.test_pypi_only == 'true' || github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@261df0ce7f0b48e1255aa78fccc69e7d929a6572 # v1.14.0
        continue-on-error: true
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: false

      - name: Publish to PyPI (Trusted Publishing via OIDC + PEP 740 Attestations)
        if: github.event.inputs.test_pypi_only != 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@261df0ce7f0b48e1255aa78fccc69e7d929a6572 # v1.14.0
        with:
          packages-dir: dist/
          attestations: true

      - name: Create GitHub Release with Artifacts, SBOMs & Provenance
        if: github.event.inputs.test_pypi_only != 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "${TAG_NAME}" dist/* --generate-notes
