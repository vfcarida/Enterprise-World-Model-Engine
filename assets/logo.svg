<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 130" width="680" height="130" fill="none">
  <style>
    .title-text { fill: #0f172a; }
    .subtitle-text { fill: #475569; }
    .mono-text { fill: #4338ca; }
    .badge-bg { fill: #e0e7ff; stroke: #c7d2fe; }
    .badge-text { fill: #4338ca; }
    .orbit-ring { stroke: #c7d2fe; }
    .branch-alt { stroke: #0284c7; }
    .node-alt { fill: #0284c7; }

    @media (prefers-color-scheme: dark) {
      .title-text { fill: #f8fafc; }
      .subtitle-text { fill: #94a3b8; }
      .mono-text { fill: #38bdf8; }
      .badge-bg { fill: #1e1b4b; stroke: #4338ca; }
      .badge-text { fill: #c7d2fe; }
      .orbit-ring { stroke: #334155; }
      .branch-alt { stroke: #38bdf8; }
      .node-alt { fill: #38bdf8; }
    }
  </style>
  <defs>
    <linearGradient id="primary-grad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="30" y1="20" x2="110" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Geometric Symbol: Enterprise State Lattice & Forward Branching Projection -->
  <g transform="translate(15, 10)">
    <!-- Background orbital ring -->
    <circle cx="55" cy="55" r="50" class="orbit-ring" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="55" cy="55" r="38" class="orbit-ring" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Branching edges -->
    <path d="M 32 55 L 55 30 L 85 40" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 55 30 L 78 78" stroke="#4f46e5" stroke-width="2" stroke-linecap="round"/>
    <path d="M 32 55 L 55 80 L 85 70" class="branch-alt" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 55 80 L 55 30" stroke="#818cf8" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M 85 40 L 98 55 L 85 70" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Forward Simulation Wavefront / Consequence Cone -->
    <path d="M 55 55 L 98 25 M 55 55 L 102 55 M 55 55 L 98 85" stroke="#a5b4fc" stroke-width="1.2" stroke-dasharray="2 3"/>

    <!-- Central State Nodes -->
    <circle cx="32" cy="55" r="7" fill="url(#primary-grad)"/>
    <circle cx="32" cy="55" r="3" fill="#ffffff"/>

    <circle cx="55" cy="30" r="5.5" fill="#4f46e5"/>
    <circle cx="55" cy="80" r="5.5" class="node-alt"/>
    <circle cx="78" cy="78" r="4" fill="#6366f1"/>

    <circle cx="85" cy="40" r="6" fill="url(#accent-grad)"/>
    <circle cx="85" cy="70" r="6" fill="url(#primary-grad)"/>
    <circle cx="98" cy="55" r="5" fill="#06b6d4"/>
  </g>

  <!-- Typography -->
  <g transform="translate(150, 0)">
    <text x="0" y="52" class="title-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-weight="800" font-size="34" letter-spacing="-0.03em">
      ENTERPRISE WORLD MODEL
    </text>
    
    <g transform="translate(488, 25)">
      <rect x="0" y="0" width="76" height="28" rx="6" class="badge-bg" stroke-width="1.2"/>
      <text x="38" y="19" class="badge-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-weight="700" font-size="13" letter-spacing="0.08em" text-anchor="middle">
        ENGINE
      </text>
    </g>

    <text x="2" y="82" class="subtitle-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-weight="500" font-size="14.5" letter-spacing="0.01em">
      Action-Conditioned Counterfactual Simulation &amp; Epistemic Evaluation
    </text>

    <text x="2" y="104" class="mono-text" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="500" font-size="11.5" letter-spacing="0.02em">
      S(t+1) ~ T(S(t), do(A(t)), E(t)) · Bitwise Reproducible · Zero-LLM Kernel
    </text>
  </g>
</svg>
