[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ewm-engine"
version = "0.1.0"
description = "Enterprise World Model Engine: Action-conditioned, uncertainty-aware simulation and evaluation of organizational systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Enterprise World Model Engine Maintainers", email = "maintainers@ewm-engine.org" }
]
keywords = [
    "world-models",
    "simulation",
    "counterfactuals",
    "operations-research",
    "socio-technical-systems",
    "decision-evaluation",
    "uncertainty-quantification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
graphs = [
    "networkx>=3.2",
]
ml = [
    "torch>=2.2.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "networkx>=3.2",
]
all = [
    "networkx>=3.2",
    "torch>=2.2.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
ewm = "ewm_engine.cli.main:main"
ewm-engine = "ewm_engine.cli.main:main"

[project.urls]
Homepage = "https://github.com/vfcarida/Enterprise-World-Model-Engine"
Documentation = "https://vfcarida.github.io/Enterprise-World-Model-Engine/"
Repository = "https://github.com/vfcarida/Enterprise-World-Model-Engine"
Issues = "https://github.com/vfcarida/Enterprise-World-Model-Engine/issues"
Changelog = "https://github.com/vfcarida/Enterprise-World-Model-Engine/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ewm_engine = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # Line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["ewm_engine"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "networkx.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "unit: fast unit tests",
    "integration: end-to-end integration tests",
    "property: hypothesis property-based tests",
    "regression: golden output regression tests",
    "benchmark: performance benchmarks",
]

[tool.coverage.run]
source = ["src/ewm_engine"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
