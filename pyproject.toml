    "z3-solver>=4.12.0",
    "ortools>=9.8.0",
    "scipy>=1.11.0",
    "torch>=2.2.0",
    "gymnasium>=0.29.0",
    "ray>=2.9.0",
    "opentelemetry-api>=1.25.0",
    "rtamt>=0.4.0",
    "salib>=1.4.0",
    "scikit-learn>=1.4.0",
    "cma>=3.3.0",
    "nevergrad>=1.0.0",
    "pymoo>=0.6.0",
    "fmpy>=0.3.20",
    "simpy>=4.1.0",
    "mesa>=3.0.0",
    "pysd>=3.14.0",
    "nashpy>=0.0.40",
    "rich>=13.0.0",
    "plotly>=5.20.0",
    "kaleido>=0.2.1",
