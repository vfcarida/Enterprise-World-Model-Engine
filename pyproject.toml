[build-system]
requires = ["hatchling>=1.21.0", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[project]
name = "ewm-engine"
dynamic = ["version"]
description = "Enterprise World Model Engine: Action-conditioned, uncertainty-aware simulation and evaluation of organizational systems."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Vinicius Caridá", email = "vfcarida@gmail.com" },
    { name = "Enterprise World Model Engine Maintainers", email = "maintainers@ewm-engine.org" },
]
keywords = [
    "world-models",
    "simulation",
    "counterfactuals",
    "operations-research",
    "socio-technical-systems",
    "decision-evaluation",
    "uncertainty-quantification",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
graphs = [
    "networkx>=3.2",
]
solvers = [
    "z3-solver>=4.12.0",
    "ortools>=9.8.0",
    "scipy>=1.11.0",
]
or = [
    "ortools>=9.8.0",
    "scipy>=1.11.0",
]
ml = [
    "torch>=2.2.0",
    "gymnasium>=0.29.0",
]
rl = [
    "gymnasium>=0.29.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "mike>=2.1.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.0",
]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "networkx>=3.2",
    "pyyaml>=6.0",
    "build>=1.1.0",
    "twine>=5.0.0",
    "opentelemetry-sdk>=1.25.0",
    "mutmut>=3.0.0",
    "syrupy>=4.6.0",
    "pytest-randomly>=3.15.0",
    "pytest-rerunfailures>=13.0",
    "pytest-socket>=0.7.0",
    "time-machine>=2.14.0",
    "diff-cover>=8.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-split>=0.8.0",
    "pytest-codspeed>=3.0.0",
    "pytest-benchmark>=4.0.0",
    "asv>=0.6.4",
    "pytest-memray>=1.7.0; sys_platform != 'win32'",
    "beartype>=0.18.0",
    "typeguard>=4.0.0",
    "pyrefly>=1.0.0",
    "hatchling>=1.21.0",
    "hatch-vcs>=0.4.0",
    "towncrier>=23.11.0",
]
distributed = [
    "ray>=2.9.0",
