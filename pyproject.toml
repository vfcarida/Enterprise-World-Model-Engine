[project.scripts]
ewm = "ewm_engine.cli.main:main"
ewm-engine = "ewm_engine.cli.main:main"

[project.urls]
Homepage = "https://github.com/vfcarida/Enterprise-World-Model-Engine"
Documentation = "https://vfcarida.github.io/Enterprise-World-Model-Engine/"
Repository = "https://github.com/vfcarida/Enterprise-World-Model-Engine"
Issues = "https://github.com/vfcarida/Enterprise-World-Model-Engine/issues"
Changelog = "https://github.com/vfcarida/Enterprise-World-Model-Engine/blob/main/CHANGELOG.md"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"
fallback_version = "1.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/ewm_engine/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ewm_engine"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/schemas",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/CITATION.cff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # Line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["ewm_engine"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "networkx.*",
    "yaml.*",
    "z3.*",
    "atheris.*",
    "fairlearn.*",
    "dice_ml.*",
    "erroranalysis.*",
    "pandas.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = [
    "error",
    "ignore:.*sigma away.*:Warning",
    "ignore:.*COBYLA.*:UserWarning",
    "ignore:.*starlette.*:Warning",
    "ignore:.*httpx.*:Warning",
    "ignore:.*install .httpx2. instead.*:Warning",
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
    "ignore:.*swig.*:DeprecationWarning",
    "ignore:.*Swig.*:DeprecationWarning",
    "ignore:.*datetime.datetime.utcnow.*:DeprecationWarning",
    "ignore:.*unclosed event loop.*:ResourceWarning",
    "ignore:.*A test tried to use socket\\.socket.*:UserWarning",
]
markers = [
    "unit: fast unit tests",
    "integration: end-to-end integration tests",
    "property: hypothesis property-based tests",
    "regression: golden output regression tests",
    "benchmark: performance benchmarks",
    "contract: public API and contract tests",
    "architecture: architecture boundary and dependency rule tests",
    "security: security and safe serialization tests",
    "example: documented and normative acceptance example tests",
    "fuzz: fuzzing smoke and harness tests",
    "flaky: quarantined tests with retry tracking",
    "codspeed: codspeed performance benchmark",
    "memory: deterministic memory limit and leak tests",
    "limit_memory: memray memory allocation limit gate",
    "limit_leaks: memray memory leak gate",
    "numerical: numerical reproducibility and differential tests",
    "packaging: packaging, wheel, and core-only tests",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "networkx>=3.2",
    "pyyaml>=6.0",
    "build>=1.1.0",
    "twine>=5.0.0",
    "mutmut>=3.0.0",
    "syrupy>=4.6.0",
    "pytest-randomly>=3.15.0",
    "pytest-rerunfailures>=13.0",
    "pytest-socket>=0.7.0",
    "time-machine>=2.14.0",
    "diff-cover>=8.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-split>=0.8.0",
    "pytest-codspeed>=3.0.0",
    "pytest-benchmark>=4.0.0",
    "asv>=0.6.4",
    "pytest-memray>=1.7.0; sys_platform != 'win32'",
    "beartype>=0.18.0",
    "typeguard>=4.0.0",
    "pyrefly>=1.0.0",
    "hatchling>=1.21.0",
    "hatch-vcs>=0.4.0",
    "towncrier>=23.11.0",
]

[tool.mutmut]
paths_to_mutate = "src/ewm_engine/core,src/ewm_engine/simulation,src/ewm_engine/constraints,src/ewm_engine/provenance,src/ewm_engine/durability,src/ewm_engine/verification"
runner = "python -m pytest -q tests/unit"
tests_dir = "tests/unit"

[tool.coverage.run]
source = ["src/ewm_engine"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.towncrier]
package = "ewm_engine"
package_dir = "src"
filename = "CHANGELOG.md"
directory = "newsfragments"
title_format = "## [{version}] - {project_date}"
issue_format = "[#{issue}](https://github.com/vfcarida/Enterprise-World-Model-Engine/issues/{issue})"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
wrap = false

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug Fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Deprecations and Removals"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneous / Internal"
showcontent = true

