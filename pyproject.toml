[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ewm-engine"
version = "1.0.0"
description = "Enterprise World Model Engine: Action-conditioned, uncertainty-aware simulation and evaluation of organizational systems."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Enterprise World Model Engine Maintainers", email = "maintainers@ewm-engine.org" }
]
keywords = [
    "world-models",
    "simulation",
    "counterfactuals",
    "operations-research",
    "socio-technical-systems",
    "decision-evaluation",
    "uncertainty-quantification",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
graphs = [
    "networkx>=3.2",
]
solvers = [
    "z3-solver>=4.12.0",
    "ortools>=9.8.0",
    "scipy>=1.11.0",
]
or = [
    "ortools>=9.8.0",
    "scipy>=1.11.0",
]
ml = [
    "torch>=2.2.0",
    "gymnasium>=0.29.0",
]
rl = [
    "gymnasium>=0.29.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "mike>=2.1.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.0",
]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "networkx>=3.2",
    "pyyaml>=6.0",
    "build>=1.1.0",
    "twine>=5.0.0",
    "opentelemetry-sdk>=1.25.0",
]
distributed = [
    "ray>=2.9.0",
]
otel = [
    "opentelemetry-api>=1.25.0",
]
stl = [
    "rtamt>=0.4.0",
]
sensitivity = [
    "salib>=1.4.0",
]
calibrate = [
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
]
opt-evolutionary = [
    "cma>=3.3.0",
    "nevergrad>=1.0.0",
]
opt-pareto = [
    "pymoo>=0.6.0",
]
surrogate = [
    "scikit-learn>=1.4.0",
]
experimentation = [
    "salib>=1.4.0",
    "scikit-learn>=1.4.0",
    "cma>=3.3.0",
    "nevergrad>=1.0.0",
    "pymoo>=0.6.0",
]
fmi = [
    "fmpy>=0.3.20",
]
simpy = [
    "simpy>=4.1.0",
]
mesa = [
    "mesa>=3.0.0",
]
sd = [
    "pysd>=3.14.0",
]
game = [
    "nashpy>=0.0.40",
]
cli = [
    "rich>=13.0.0",
]
viz = [
    "plotly>=5.20.0",
]
viz-export = [
    "kaleido>=0.2.1",
]
serve = [
    "fastapi>=0.110.0",
    "httpx>=0.25.0",
]
config = [
    "omegaconf>=2.3.0",
]
trackers = [
    "mlflow>=2.10.0",
]
interop = [
    "simpy>=4.1.0",
    "nashpy>=0.0.40",
    "rich>=13.0.0",
    "plotly>=5.20.0",
    "fastapi>=0.110.0",
    "httpx>=0.25.0",
    "omegaconf>=2.3.0",
]
all = [
    "networkx>=3.2",
    "z3-solver>=4.12.0",
    "ortools>=9.8.0",
    "scipy>=1.11.0",
    "torch>=2.2.0",
    "gymnasium>=0.29.0",
    "ray>=2.9.0",
    "opentelemetry-api>=1.25.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "build>=1.1.0",
    "twine>=5.0.0",
]

[project.scripts]
ewm = "ewm_engine.cli.main:main"
ewm-engine = "ewm_engine.cli.main:main"

[project.urls]
Homepage = "https://github.com/vfcarida/Enterprise-World-Model-Engine"
Documentation = "https://vfcarida.github.io/Enterprise-World-Model-Engine/"
Repository = "https://github.com/vfcarida/Enterprise-World-Model-Engine"
Issues = "https://github.com/vfcarida/Enterprise-World-Model-Engine/issues"
Changelog = "https://github.com/vfcarida/Enterprise-World-Model-Engine/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ewm_engine = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # Line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["ewm_engine"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "networkx.*",
    "yaml.*",
    "z3.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "unit: fast unit tests",
    "integration: end-to-end integration tests",
    "property: hypothesis property-based tests",
    "regression: golden output regression tests",
    "benchmark: performance benchmarks",
    "contract: public API and contract tests",
    "architecture: architecture boundary and dependency rule tests",
    "security: security and safe serialization tests",
    "example: documented and normative acceptance example tests",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "networkx>=3.2",
    "pyyaml>=6.0",
    "build>=1.1.0",
    "twine>=5.0.0",
]

[tool.coverage.run]
source = ["src/ewm_engine"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
